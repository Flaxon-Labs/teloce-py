[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teloce-py"
description = "A Python compiler for Teloce .vel Single File Components"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Teloce Contributors" }
]
maintainers = [
    { name = "Aldane Hutchinson, email = "Aldane Hutchinson" }
]
keywords = [
    "teloce",
    "compiler",
    "sfc",
    "template-engine",
    "python",
    "flask",
    "django",
    "fastapi",
    "flaxon"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.10"
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://teloce.dev"
Documentation = "https://docs.teloce.dev"
Repository = "https://github.com/aldanedev-create/telonce"
Issues = "https://github.com/aldanedev-create/telonce/issues"
Changelog = "https://github.com/aldanedev-create/telonce/blob/main/CHANGELOG.md"

[project.scripts]
teloce = "teloce.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }
include-package-data = true

[tool.setuptools.package-data]
"teloce.runtime" = ["*.js"]

[tool.setuptools.dynamic]
version = { attr = "teloce.version.__version__" }

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
